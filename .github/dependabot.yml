version: 2
updates:
  # pnpm (package.json + pnpm-lock.yaml), semanal, menores/parches agrupados.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      menores:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns:
          - "*"
    commit-message:
      prefix: chore
